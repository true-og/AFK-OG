# the time in seconds of inactivity before the player is marked as afk
# use '-1' to disable this feature
afk-timeout-seconds: 300

# prevent afk players from moving
freeze-afk-players: false

# cancel afk status if the player jumps
# ONLY WORKS IF 'freeze-afk-players' IS TRUE
cancel-afk-on-jump: true

# the player cannot take damage when they are afk
invulnerable-during-afk: true

# kick players after this many seconds of true inactivity (no movement, no input).
# set to -1 to disable.
afk-kick-seconds: 1200

# kick message shown to kicked players. supports legacy '&' color codes.
afk-kick-message: "&cYou have been kicked for being AFK too long.\n&7Buy a rank at &bhttps://shop.trueog.net &7to bypass the AFK timer."
